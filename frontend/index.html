<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MnSight AI — Mining Intelligence System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #e8ecf5;
      }

      /* ── 3D utilities ─────────────────────────────── */
      .perspective-1200 { perspective: 1200px; }
      .perspective-800 { perspective: 800px; }
      .preserve-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }

      /* ── Keyframes ────────────────────────────────── */
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-24px) rotate(3deg); }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(30px) translateX(-18px); }
      }
      @keyframes orb-drift {
        0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
        33% { transform: translate(60px, -40px) scale(1.15); opacity: 0.5; }
        66% { transform: translate(-40px, 30px) scale(0.9); opacity: 0.3; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      }
      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.6); opacity: 0.9; }
        80% { transform: scale(2.4); opacity: 0; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.25); opacity: 0.75; }
      }
      @keyframes scan-line {
        0% { top: -10%; }
        100% { top: 110%; }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes grid-move {
        from { background-position: 0 0; }
        to { background-position: 48px 48px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      /* ── Animated background orbs ─────────────────── */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: orb-drift 14s ease-in-out infinite;
      }
      .orb-1 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(255,152,0,0.35), transparent 70%); top: -100px; left: -120px; }
      .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(63,81,181,0.4), transparent 70%); bottom: -80px; right: -100px; animation-delay: -5s; }
      .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,200,150,0.3), transparent 70%); top: 40%; left: 60%; animation-delay: -9s; }

      /* ── Hero ─────────────────────────────────────── */
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        perspective: 1200px;
      }
      .hero-title {
        font-size: clamp(2.6rem, 7vw, 5.5rem);
        font-weight: 900;
        letter-spacing: -1.5px;
        background: linear-gradient(120deg, #ff9800, #ff5c8a, #4fc3f7, #ff9800);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradient-shift 6s ease infinite;
        filter: drop-shadow(0 4px 24px rgba(255,152,0,0.35));
      }
      .hero-sub {
        font-size: clamp(0.95rem, 2vw, 1.25rem);
        color: rgba(255,255,255,0.65);
        max-width: 640px;
        margin: 18px auto 0;
        line-height: 1.6;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(255,152,0,0.12);
        border: 1px solid rgba(255,152,0,0.35);
        color: #ffb74d;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .hero-badge .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #4caf50;
        animation: pulse-dot 1.6s infinite;
      }
      .scroll-hint {
        position: absolute;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: rgba(255,255,255,0.5);
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: bob 2s ease-in-out infinite;
        cursor: pointer;
      }
      .scroll-hint svg { animation: blink 1.8s infinite; }

      /* ── 3D hero map card ─────────────────────────── */
      .hero-map-card {
        position: relative;
        width: min(760px, 88vw);
        height: 380px;
        margin-top: 40px;
        border-radius: 20px;
        transform-style: preserve-3d;
        background: rgba(13,27,42,0.6);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 0 60px rgba(79,195,247,0.05);
        overflow: hidden;
      }
      .hero-map-card::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 22px;
        padding: 2px;
        background: linear-gradient(120deg, #ff9800, #4fc3f7, #ff5c8a, #ff9800);
        background-size: 300% 300%;
        animation: gradient-shift 5s linear infinite;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .hero-map-card .scanline {
        position: absolute;
        left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(79,195,247,0.7), transparent);
        animation: scan-line 4s linear infinite;
        pointer-events: none;
        z-index: 5;
      }
      .hero-map-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(79,195,247,0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79,195,247,0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        animation: grid-move 6s linear infinite;
        pointer-events: none;
      }
      .hero-float-chip {
        position: absolute;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        background: rgba(13,27,42,0.85);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        animation: float 5s ease-in-out infinite;
        z-index: 6;
      }
      .hero-float-chip.one { top: 18%; left: 6%; color: #ffb74d; }
      .hero-float-chip.two { top: 60%; left: 78%; color: #4fc3f7; animation-delay: -1.5s; }
      .hero-float-chip.three { top: 30%; right: 8%; color: #a5d6a7; animation-delay: -3s; }

      /* ── Glass panels ─────────────────────────────── */
      .glass {
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      }
      .glass-strong {
        background: rgba(13,27,42,0.82);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      /* ── Dashboard layout ─────────────────────────── */
      .dashboard {
        position: relative;
        min-height: 100vh;
        padding: 24px;
        perspective: 1200px;
      }
      .nav-bar {
        position: sticky;
        top: 16px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-radius: 16px;
        backdrop-filter: blur(20px);
        background: rgba(10,18,32,0.75);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      }
      .nav-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        border-radius: 12px;
        border: none;
        background: transparent;
        color: rgba(255,255,255,0.55);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.08); }
      .nav-tab.active {
        color: #ff9800;
        background: rgba(255,152,0,0.15);
        box-shadow: inset 0 0 0 1px rgba(255,152,0,0.3);
      }
      .view-frame {
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        transform-style: preserve-3d;
        background: rgba(8,14,26,0.7);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 0 80px rgba(79,195,247,0.04);
      }

      /* ── Map dynamic look ─────────────────────────── */
      .map-wrap {
        position: relative;
        height: calc(100vh - 180px);
        min-height: 480px;
        border-radius: 18px;
        overflow: hidden;
        transform-style: preserve-3d;
      }
      .map-wrap::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 500;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(255,152,0,0.06), transparent 55%),
          radial-gradient(ellipse at 75% 75%, rgba(79,195,247,0.06), transparent 55%);
      }
      .map-scanline {
        position: absolute;
        left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(79,195,247,0.4), transparent);
        animation: scan-line 7s linear infinite;
        pointer-events: none;
        z-index: 501;
      }
      /* pulsing markers */
      .mn-marker, .mine-marker, .drill-marker, .selected-marker {
        position: relative;
      }
      .mn-marker::after, .mine-marker::after, .drill-marker::after, .selected-marker::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid currentColor;
        animation: pulse-ring 2.2s ease-out infinite;
      }
      .selected-marker::after { border-color: #ff4444; animation-duration: 1.4s; }
      .drill-marker::after { border-color: #00ff88; animation-duration: 1.8s; }
      .mn-marker::after { border-color: #8B4513; }
      .mine-marker::after { border-color: #FFD700; }

      .stats-chip {
        animation: float 6s ease-in-out infinite;
        backdrop-filter: blur(14px);
        background: rgba(10,18,32,0.8);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 14px;
        padding: 10px 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
      .stats-chip:nth-child(2) { animation-delay: -2s; }

      .legend-panel {
        animation: float 7s ease-in-out infinite;
        backdrop-filter: blur(16px);
        background: rgba(10,18,32,0.82);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 16px;
        padding: 14px 18px;
        box-shadow: 0 14px 40px rgba(0,0,0,0.45);
      }

      /* ── Reusable animated section headers ────────── */
      .section-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
        background: linear-gradient(120deg, #ff9800, #4fc3f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* ── Scrollbar ────────────────────────────────── */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(255,152,0,0.5), rgba(79,195,247,0.5));
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,152,0,0.8); }

      /* ── Leaflet overrides ────────────────────────── */
      .leaflet-control-layers { border-radius: 12px !important; overflow: hidden; backdrop-filter: blur(10px); }
      .leaflet-popup-content-wrapper {
        border-radius: 14px !important;
        background: rgba(10,18,32,0.95) !important;
        color: #e8ecf5 !important;
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 16px 50px rgba(0,0,0,0.6) !important;
      }
      .leaflet-popup-tip { background: rgba(10,18,32,0.95) !important; }
      .leaflet-popup-close-button { color: #fff !important; }
      .leaflet-container { background: #0a1220; }
      .leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important; }
      .leaflet-control-zoom a { background: rgba(10,18,32,0.9) !important; color: #fff !important; border-color: rgba(255,255,255,0.15) !important; }
      .coord-display {
        backdrop-filter: blur(10px);
        background: rgba(10,18,32,0.85) !important;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
      }
      .leaflet-bar a {
        transition: background 0.2s;
      }
      .leaflet-bar a:hover { background: rgba(255,152,0,0.2) !important; }

      /* ── Panel theming (dark glass) ───────────────── */
      .panel-dark {
        background: rgba(10,18,32,0.85) !important;
        color: #e8ecf5 !important;
        border: 1px solid rgba(255,255,255,0.12) !important;
        backdrop-filter: blur(18px);
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .panel-dark input, .panel-dark select {
        background: rgba(255,255,255,0.08) !important;
        color: #fff !important;
        border: 1px solid rgba(255,255,255,0.2) !important;
        border-radius: 8px;
      }
      .panel-dark input::placeholder { color: rgba(255,255,255,0.4); }

      /* shimmer text */
      .shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0.4) 25%, #fff 50%, rgba(255,255,255,0.4) 75%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 3s linear infinite;
      }

      /* reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
